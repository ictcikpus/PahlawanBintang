<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pahlawan Bintang: Penjaga Istana Imut</title>

  <!-- PWA Metadata & Favicon -->
  <link rel="icon" id="appFavicon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23FFD700'/><path d='M50 15 L62 38 L88 42 L69 60 L73 85 L50 73 L27 85 L31 60 L12 42 L38 38 Z' fill='%23FF4500'/></svg>">
  <meta name="theme-color" content="#4A90E2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDK Client untuk Realtime Leaderboard di GitHub Pages -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD Game -->
    <div id="hud-overlay" class="hidden">
      <div class="hud-top">
        <div class="hud-card"><span class="hud-label">PAHLAWAN</span><span id="player-name-display" class="hud-value">Pahlawan</span></div>
        <div class="hud-card"><span class="hud-label">LEVEL</span><span id="hud-level" class="hud-value">1</span></div>
        <div class="hud-card"><span class="hud-label">SKOR</span><span id="hud-score" class="hud-value">0</span></div>
        <div class="hud-card"><span class="hud-label">NYAWA</span><div id="hud-lives" class="hud-lives">❤️❤️❤️</div></div>
      </div>
      <div class="hud-bottom">
        <button id="btn-freeze" class="btn-powerup">❄️</button>
        <button id="btn-bomb" class="btn-powerup">🌈</button>
        <button id="btn-audio" class="btn-icon">🔊</button>
      </div>
    </div>

    <!-- Menu Utama -->
    <div id="screen-main-menu" class="modal-screen">
      <div class="modal-box">
        <h1 class="game-title">PAHLAWAN BINTANG 🌟</h1>
        <p class="subtitle">Penjaga Istana Imut</p>

        <div class="input-group">
          <label for="player-name-input">Nama Pahlawan Cilik:</label>
          <input type="text" id="player-name-input" placeholder="Ketik Namamu..." maxlength="12" value="Pahlawan">
        </div>

        <div class="menu-buttons">
          <button id="btn-start" class="btn-primary">🎮 MAIN SEKARANG!</button>
          <button id="btn-leaderboard" class="btn-secondary">🏆 PAPAN PERINGKAT 10 BESAR</button>
          <button id="btn-stickers" class="btn-secondary">🖼️ ALBUM STIKER (<span id="unlocked-count">0</span>/30)</button>
          <button id="btn-pwa-install" class="btn-accent hidden">📱 INSTALL APLIKASI DI HP</button>
        </div>
      </div>
    </div>

    <!-- Modal Leaderboard Realtime -->
    <div id="modal-leaderboard" class="modal-screen hidden">
      <div class="modal-box">
        <h2>🏆 PAPAN PERINGKAT 10 BESAR 🏆</h2>
        <p class="small-text">Skor Tertinggi Seluruh Pemain (Global)</p>
        
        <div class="leaderboard-table-container">
          <table class="leaderboard-table">
            <thead>
              <tr><th>Pos</th><th>Nama</th><th>Level</th><th>Skor</th></tr>
            </thead>
            <tbody id="leaderboard-body">
              <tr><td colspan="4">Memuat Papan Peringkat...</td></tr>
            </tbody>
          </table>
        </div>

        <button id="btn-close-leaderboard" class="btn-primary">KEMBALI</button>
      </div>
    </div>

    <!-- Modal Hasil Selesai -->
    <div id="modal-result" class="modal-screen hidden">
      <div class="modal-box">
        <h2 id="result-title">LEVEL SELESAI! 🎉</h2>
        <div class="result-details">
          <p>Pahlawan: <strong id="result-player-name">Pahlawan</strong></p>
          <p>Skor Akhir: <strong id="result-score">0</strong></p>
          <p>Level Dicapai: <strong id="result-level">1</strong></p>
        </div>
        <div class="menu-buttons">
          <button id="btn-next-level" class="btn-primary">LANJUT LEVEL ▶</button>
          <button id="btn-restart" class="btn-secondary">MAIN LAGI 🔄</button>
          <button id="btn-menu" class="btn-secondary">MENU UTAMA 🏠</button>
        </div>
      </div>
    </div>

    <!-- Modal Album Stiker -->
    <div id="modal-stickers" class="modal-screen hidden">
      <div class="modal-box modal-wide">
        <h2>🖼️ ALBUM 30 STIKER HADIAH 🖼️</h2>
        <div id="sticker-grid" class="sticker-grid"></div>
        <button id="btn-close-stickers" class="btn-primary">KEMBALI</button>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
